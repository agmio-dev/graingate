<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 400" width="868" height="400" role="img" aria-label="Linkage attack: plain masking narrows to 1 person, GrainGate stops at 638" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#ffffff} .ink{fill:#1f2328} .mute{fill:#59636e} .rule{stroke:#d1d9e0}
  .bad{fill:#cf222e} .good{fill:#1a7f37} .neutral{fill:#8c959f} .floor{stroke:#9a6700}
  .floort{fill:#9a6700}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .ink{fill:#e6edf3} .mute{fill:#9198a1} .rule{stroke:#30363d}
    .bad{fill:#f85149} .good{fill:#3fb950} .neutral{fill:#6e7681} .floor{stroke:#d29922} .floort{fill:#d29922}
  }

  .g{transform-box:fill-box;transform-origin:left center}
  .anim{animation-duration:14.0s;animation-iteration-count:infinite;animation-timing-function:ease-out}
  @media (prefers-reduced-motion: reduce){.anim{animation:none!important}}
@keyframes b0{0%,5.71%{transform:scaleX(0);opacity:0}5.72%{opacity:1}12.14%,94%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes t0{0%,10.00%{opacity:0}12.00%,94%{opacity:1}100%{opacity:0}}
@keyframes b1{0%,19.29%{transform:scaleX(0);opacity:0}19.30%{opacity:1}25.71%,94%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes t1{0%,23.57%{opacity:0}25.57%,94%{opacity:1}100%{opacity:0}}
@keyframes b2{0%,32.86%{transform:scaleX(0);opacity:0}32.87%{opacity:1}39.29%,94%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes t2{0%,37.14%{opacity:0}39.14%,94%{opacity:1}100%{opacity:0}}
@keyframes b3{0%,46.43%{transform:scaleX(0);opacity:0}46.44%{opacity:1}52.86%,94%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes t3{0%,50.71%{opacity:0}52.71%,94%{opacity:1}100%{opacity:0}}
@keyframes b4{0%,60.00%{transform:scaleX(0);opacity:0}60.01%{opacity:1}66.43%,94%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes t4{0%,64.29%{opacity:0}66.29%,94%{opacity:1}100%{opacity:0}}
@keyframes fin{0%,68.57%{opacity:0}70.57%,94%{opacity:1}100%{opacity:0}}
</style>
<rect class="bg" width="868" height="400" rx="10"/>
<text class="ink" x="24" y="34" font-size="17" font-weight="600">Linkage attack: a recruitment agent asks for five harmless details, exactly</text>
<text class="mute" x="24" y="56" font-size="12.5">Demo patient L-00103 (fertility testing). Bars = people still matching, log scale. k = 20, l = 4.</text>
<text class="ink" x="24" y="84" font-size="13.5" font-weight="600">Plain masking (names removed, values exact)</text>
<line class="floor" x1="252.2" y1="96" x2="252.2" y2="310" stroke-dasharray="4 3" stroke-width="1.3"/>
<text class="floort" x="255.2" y="324" font-size="10.5">k = 20</text>
<text class="mute" x="24" y="115" font-size="12">1. age = 26</text>
<rect class="g anim bad" style="animation-name:b0" x="214" y="102" width="67.2" height="18" rx="3"/>
<g class="anim" style="animation-name:t0"><text class="ink" x="287.2" y="112" font-size="12" font-weight="600">209</text><text class="mute" x="287.2" y="127" font-size="10.5">10 finding groups</text></g>
<text class="mute" x="24" y="159" font-size="12">2. sex = F</text>
<rect class="g anim bad" style="animation-name:b1" x="214" y="146" width="59.3" height="18" rx="3"/>
<g class="anim" style="animation-name:t1"><text class="ink" x="279.3" y="156" font-size="12" font-weight="600">111</text><text class="mute" x="279.3" y="171" font-size="10.5">10 finding groups</text></g>
<text class="mute" x="24" y="203" font-size="12">3. pincode = 560038</text>
<rect class="g anim bad" style="animation-name:b2" x="214" y="190" width="26.1" height="18" rx="3"/>
<g class="anim" style="animation-name:t2"><text class="ink" x="260.2" y="200" font-size="12" font-weight="600">7</text><text class="mute" x="260.2" y="215" font-size="10.5">3 finding groups</text></g>
<text class="mute" x="24" y="247" font-size="12">4. panel = Fertility Panel</text>
<rect class="g anim bad" style="animation-name:b3" x="214" y="234" width="22.5" height="18" rx="3"/>
<g class="anim" style="animation-name:t3"><text class="ink" x="260.2" y="244" font-size="12" font-weight="600">5</text><text class="bad" x="260.2" y="259" font-size="10.5">1 group → result known</text></g>
<text class="mute" x="24" y="291" font-size="12">5. month = September</text>
<rect class="g anim bad" style="animation-name:b4" x="214" y="278" width="8.7" height="18" rx="3"/>
<g class="anim" style="animation-name:t4"><text class="ink" x="260.2" y="288" font-size="12" font-weight="600">1</text><text class="bad" x="260.2" y="303" font-size="10.5">1 group → result known</text></g>
<text class="ink" x="448" y="84" font-size="13.5" font-weight="600">Behind GrainGate (release policy)</text>
<line class="floor" x1="676.2" y1="96" x2="676.2" y2="310" stroke-dasharray="4 3" stroke-width="1.3"/>
<text class="floort" x="679.2" y="324" font-size="10.5">k = 20</text>
<text class="mute" x="448" y="115" font-size="12">1. age → withheld</text>
<rect class="g anim neutral" style="animation-name:b0" x="638" y="102" width="118.0" height="18" rx="3"/>
<g class="anim" style="animation-name:t0"><text class="ink" x="762.0" y="112" font-size="12" font-weight="600">12,000</text><text class="mute" x="762.0" y="127" font-size="10.5">10 finding groups</text></g>
<text class="mute" x="448" y="159" font-size="12">2. sex = F</text>
<rect class="g anim good" style="animation-name:b1" x="638" y="146" width="109.6" height="18" rx="3"/>
<g class="anim" style="animation-name:t1"><text class="ink" x="753.6" y="156" font-size="12" font-weight="600">6,162</text><text class="mute" x="753.6" y="171" font-size="10.5">10 finding groups</text></g>
<text class="mute" x="448" y="203" font-size="12">3. pincode → Bengaluru East</text>
<rect class="g anim good" style="animation-name:b2" x="638" y="190" width="93.5" height="18" rx="3"/>
<g class="anim" style="animation-name:t2"><text class="ink" x="737.5" y="200" font-size="12" font-weight="600">1,706</text><text class="mute" x="737.5" y="215" font-size="10.5">9 finding groups</text></g>
<text class="mute" x="448" y="247" font-size="12">4. panel → Specialised</text>
<rect class="g anim good" style="animation-name:b3" x="638" y="234" width="81.2" height="18" rx="3"/>
<g class="anim" style="animation-name:t3"><text class="ink" x="725.2" y="244" font-size="12" font-weight="600">638</text><text class="mute" x="725.2" y="259" font-size="10.5">5 finding groups</text></g>
<text class="mute" x="448" y="291" font-size="12">5. month → withheld</text>
<rect class="g anim neutral" style="animation-name:b4" x="638" y="278" width="81.2" height="18" rx="3"/>
<g class="anim" style="animation-name:t4"><text class="ink" x="725.2" y="288" font-size="12" font-weight="600">638</text><text class="mute" x="725.2" y="303" font-size="10.5">5 finding groups</text></g>
<g class="anim" style="animation-name:fin"><rect class="bad" x="24" y="332" width="396" height="28" rx="6" opacity="0.12"/><text class="bad" x="36" y="351" font-size="13" font-weight="600">1 person — identified, fertility testing exposed</text><rect class="good" x="448" y="332" width="396" height="28" rx="6" opacity="0.12"/><text class="good" x="460" y="351" font-size="13" font-weight="600">Stops at 638 ≥ k, with 5 ≥ l finding groups</text></g>
</svg>
